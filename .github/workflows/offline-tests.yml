name: Offline regression tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install offline test tools only
        run: python -m pip install 'pytest==8.2.0' 'coverage==7.16.0'
      - name: Run hardware-free regression suite
        run: python -m coverage run --branch -m pytest -m 'not requires_srx'
      - name: Report measured coverage
        run: python -m coverage report
