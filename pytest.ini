[pytest]
# Register the custom marker so unmarked-collection works and `-m` filtering
# is reliable. Tests needing live infrastructure (SRX, system binaries, raw
# sockets) are marked requires_srx; run the offline logic layer with:
#     pytest -m "not requires_srx"
markers =
    requires_srx: test requires a live SRX and/or system binaries / privileges (deselect with -m "not requires_srx")
testpaths = tests
addopts = -ra --strict-markers
