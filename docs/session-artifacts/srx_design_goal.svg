<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="940" viewBox="0 0 1180 940" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#37474f"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#1565c0"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2e7d32"/>
    </marker>
    <style>
      .title { font-size: 26px; font-weight: 700; fill: #102027; }
      .sub   { font-size: 14px; fill: #546e7a; }
      .goal  { font-size: 15px; fill: #263238; }
      .goalb { font-size: 15px; font-weight: 700; fill: #102027; }
      .layer { font-size: 17px; font-weight: 700; fill: #ffffff; }
      .layn  { font-size: 12.5px; fill: #eceff1; }
      .lbl   { font-size: 14px; font-weight: 700; fill: #ffffff; }
      .small { font-size: 12.5px; fill: #37474f; }
      .badge { font-size: 12px; font-weight:700; fill:#ffffff; }
      .q     { font-size: 15px; font-style: italic; fill: #0d47a1; }
    </style>
  </defs>

  <rect width="1180" height="940" fill="#f5f7fa"/>
  <text x="40" y="46" class="title">Design Goal — Juniper SRX Transit Security Detection Probe</text>
  <text x="40" y="70" class="sub">konnaf24/srx  ·  a telemetry-VALIDATION suite, not a config/policy checker</text>

  <!-- Goal statement box -->
  <rect x="40" y="90" width="1100" height="118" rx="12" fill="#fffde7" stroke="#fbc02d" stroke-width="2"/>
  <text x="60" y="120" class="goalb">Goal: verify that an SRX in internet-transit mode correctly EMITS security telemetry when known traffic</text>
  <text x="60" y="142" class="goalb">(including synthetic-attack patterns) crosses it — validating DETECTION &amp; LOGGING, not zone/policy/routing.</text>
  <text x="60" y="176" class="q">"When a known stimulus crosses the SRX, does it emit the expected telemetry, with complete</text>
  <text x="60" y="196" class="q"> fields, that we can correlate back to exactly that stimulus?"</text>

  <!-- Core loop banner -->
  <text x="40" y="242" class="goalb" font-size="17">Core loop</text>
  <rect x="150" y="224" width="230" height="34" rx="17" fill="#455a64"/>
  <text x="175" y="246" class="badge">generate known event</text>
  <path d="M380,241 L410,241" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="412" y="224" width="250" height="34" rx="17" fill="#1565c0"/>
  <text x="432" y="246" class="badge">capture every telemetry stream</text>
  <path d="M662,241 L692,241" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="694" y="224" width="200" height="34" rx="17" fill="#00695c"/>
  <text x="716" y="246" class="badge">correlate by 5-tuple</text>
  <path d="M894,241 L924,241" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="926" y="224" width="214" height="34" rx="17" fill="#6a1b9a"/>
  <text x="946" y="246" class="badge">assert fields present</text>

  <!-- ===== Pipeline: 4 functional layers ===== -->
  <text x="40" y="300" class="goalb" font-size="17">Four functional layers</text>

  <!-- Layer 1: Generation -->
  <rect x="40" y="320" width="250" height="150" rx="12" fill="#455a64"/>
  <text x="60" y="348" class="layer">1 · Generation</text>
  <text x="60" y="372" class="layn">Produce a KNOWN event:</text>
  <text x="60" y="392" class="layn">5-tuple + payload + timestamp</text>
  <text x="60" y="416" class="layn">scapy · nmap/hping3</text>
  <text x="60" y="434" class="layn">curl/requests · playwright</text>
  <text x="60" y="452" class="layn">wrk/iperf3 (EICAR/GTUBE)</text>

  <!-- Layer 2: Telemetry sources (the SRX) -->
  <rect x="320" y="320" width="270" height="150" rx="12" fill="#1565c0"/>
  <text x="340" y="348" class="layer">2 · Telemetry sources</text>
  <text x="340" y="372" class="layn">The SRX features under test:</text>
  <text x="340" y="392" class="layn">RT_FLOW (create/close/deny)</text>
  <text x="340" y="410" class="layn">RT_IDP / IPS · screen events</text>
  <text x="340" y="428" class="layn">AppSecure (App-ID/AppFW/URL)</text>
  <text x="340" y="446" class="layn">UTM/AV · NETCONF · IPFIX</text>

  <!-- Layer 3: Collection -->
  <rect x="620" y="320" width="250" height="150" rx="12" fill="#00695c"/>
  <text x="640" y="348" class="layer">3 · Collection</text>
  <text x="640" y="372" class="layn">Capture what SRX emits:</text>
  <text x="640" y="392" class="layn">syslog listener (sd-syslog)</text>
  <text x="640" y="410" class="layn">NETCONF / PyEZ queries</text>
  <text x="640" y="428" class="layn">egress pcap (tshark/tcpdump)</text>
  <text x="640" y="446" class="layn">= independent ground truth</text>

  <!-- Layer 4: Validation -->
  <rect x="900" y="320" width="240" height="150" rx="12" fill="#6a1b9a"/>
  <text x="920" y="348" class="layer">4 · Validation</text>
  <text x="920" y="372" class="layn">Correlate sent vs collected:</text>
  <text x="920" y="392" class="layn">match 5-tuple in time window</text>
  <text x="920" y="410" class="layn">event_present · field_complete</text>
  <text x="920" y="428" class="layn">signature/app/category match</text>
  <text x="920" y="446" class="layn">→ detection-coverage matrix</text>

  <!-- arrows between layers -->
  <path d="M290,395 L318,395" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <path d="M590,395 L618,395" stroke="#00695c" stroke-width="2.5" marker-end="url(#arrowGreen)"/>
  <path d="M870,395 L898,395" stroke="#6a1b9a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- ===== Transit data-path diagram ===== -->
  <text x="40" y="522" class="goalb" font-size="17">Transit data path</text>

  <rect x="40" y="540" width="180" height="70" rx="10" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="60" y="572" class="small" font-weight="700">Workload generator</text>
  <text x="60" y="592" class="small">known stimulus</text>

  <rect x="300" y="530" width="220" height="90" rx="10" fill="#e8eaf6" stroke="#3949ab" stroke-width="2.5"/>
  <text x="322" y="562" class="small" font-weight="700">Juniper SRX</text>
  <text x="322" y="582" class="small">transit enforcement point</text>
  <text x="322" y="602" class="small">(device under test)</text>

  <rect x="600" y="540" width="170" height="70" rx="10" fill="#eceff1" stroke="#607d8b" stroke-width="2"/>
  <text x="620" y="572" class="small" font-weight="700">Internet / external</text>
  <text x="620" y="592" class="small">destination</text>

  <!-- data path arrows -->
  <path d="M220,575 L298,575" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text x="224" y="566" class="small" fill="#2e7d32">internet-bound traffic</text>
  <path d="M520,575 L598,575" stroke="#2e7d32" stroke-width="3" marker-end="url(#arrowGreen)"/>

  <!-- telemetry emit down to collector/correlator -->
  <path d="M410,620 L410,660" stroke="#1565c0" stroke-width="2.5" marker-end="url(#arrowBlue)"/>
  <text x="420" y="646" class="small" fill="#1565c0">SRX emits telemetry</text>

  <rect x="300" y="662" width="220" height="56" rx="10" fill="#00695c"/>
  <text x="322" y="686" class="lbl">Log / Event Collector</text>
  <text x="322" y="706" class="layn">syslog · NETCONF · pcap</text>

  <path d="M410,718 L410,752" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="300" y="754" width="220" height="56" rx="10" fill="#6a1b9a"/>
  <text x="322" y="778" class="lbl">Validation / Correlation</text>
  <text x="322" y="798" class="layn">stimulus ⇄ telemetry · assert</text>

  <path d="M520,782 L560,782" stroke="#37474f" stroke-width="2.5" marker-end="url(#arrow)"/>
  <rect x="562" y="754" width="180" height="56" rx="10" fill="#455a64"/>
  <text x="584" y="786" class="lbl">Report / Findings</text>

  <!-- ===== What it is / isn't panel ===== -->
  <rect x="800" y="530" width="340" height="288" rx="12" fill="#ffffff" stroke="#b0bec5" stroke-width="1.5"/>
  <text x="820" y="560" class="goalb" font-size="16">Scope</text>

  <text x="820" y="588" class="small" fill="#2e7d32" font-weight="700">✔ Validates</text>
  <text x="820" y="610" class="small">• detection &amp; logging behavior</text>
  <text x="820" y="630" class="small">• telemetry completeness of fields</text>
  <text x="820" y="650" class="small">• correlation back to the exact stimulus</text>
  <text x="820" y="670" class="small">• safe synthetic signatures (EICAR/GTUBE)</text>

  <text x="820" y="702" class="small" fill="#c62828" font-weight="700">✘ Does NOT validate</text>
  <text x="820" y="724" class="small">• zone / policy correctness</text>
  <text x="820" y="744" class="small">• routing correctness</text>
  <text x="820" y="764" class="small">• uses no live malware</text>
  <text x="820" y="792" class="small" fill="#c62828">• attack gen = authorized labs only</text>

  <text x="40" y="900" class="sub">Answer captured as a detection-coverage matrix: per event type — detected? logged? all fields present?</text>
</svg>
